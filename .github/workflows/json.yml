name: JSON input checks

on:
  push:
    paths:
      - 'inverter_interface_checks/**'
      - 'tests/test_json*.py'
      - '.github/workflows/json.yml'
  pull_request:
    paths:
      - 'inverter_interface_checks/**'
      - 'tests/test_json*.py'
      - '.github/workflows/json.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check passive JSON boundaries
        run: python -B -m unittest discover -s tests -p 'test_json*.py' -v
