name: Report Space checks

on:
  push:
    paths:
      - 'space/**'
      - '.github/workflows/space.yml'
  pull_request:
    paths:
      - 'space/**'
      - '.github/workflows/space.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify retained release assets
        run: python -B space/verify_assets.py
      - name: Install browser test dependencies
        working-directory: space
        run: npm ci --ignore-scripts
      - name: Install Chromium
        working-directory: space
        run: npx playwright install --with-deps chromium
      - name: Check report reader and browser behavior
        working-directory: space
        run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: report-space-browser
          path: space/.test-output/
          retention-days: 14
