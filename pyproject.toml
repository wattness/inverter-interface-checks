[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inverter-interface-checks"
version = "0.1.0"
description = "Bounded metadata and parameter checks for native inverter interfaces"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
inverter-interface-checks = "inverter_interface_checks.cli:main"

[tool.setuptools.packages.find]
include = ["inverter_interface_checks*"]

[tool.setuptools]
license-files = ["LICENSE", "third_party/NOTICE.md", "third_party/openibr/NOTICE"]

[tool.setuptools.package-data]
inverter_interface_checks = ["adapters/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
ignore = ["E402"]
